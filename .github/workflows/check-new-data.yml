name: check new data

on:
  schedule:
    - cron: '26 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-new-data
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'YouthOpps/youthopps.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check latest data-source commit
        run: |
          set -euo pipefail
          git submodule update --init --remote data-source
      - name: Commit updated submodule cursor
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitmodules data-source
          if git diff --cached --quiet; then
            echo "No data-source changes"
            exit 0
          fi
          git commit -m "data: sync data-source submodule"
          git push origin HEAD:main
